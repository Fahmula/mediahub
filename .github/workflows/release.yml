name: Release
# release-please keeps a release PR open from the Conventional Commits on main. Merging it tags the
# release; CI and the image build are called from here because a tag pushed with GITHUB_TOKEN
# doesn't start other workflows.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  test:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml

  docker:
    needs: [release-please, test]
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    permissions:
      contents: read
      packages: write
