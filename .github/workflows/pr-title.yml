name: PR title
# Squash merges put the PR title on main, and release-please only reads Conventional Commits there.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|deps|revert|docs|style|refactor|test|build|ci|chore)(\([a-z0-9-]+\))?!?: .+'
          if ! grep -qE "$pattern" <<< "$TITLE"; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat: add X' or 'fix(emby): handle Y'"
            exit 1
          fi
