<form hx-post="/settings/account/password" hx-swap="outerHTML" class="space-y-3">
  <input type="text" name="username" value="{{ auth.username }}" autocomplete="username" hidden>
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
    <label class="block space-y-1.5"><span class="text-sm font-medium">Current password</span>
      <input class="input w-full" type="password" name="current_password" autocomplete="current-password" required></label>
    <label class="block space-y-1.5"><span class="text-sm font-medium">New password</span>
      <input class="input w-full" type="password" name="new_password" autocomplete="new-password" minlength="{{ min_length }}" required></label>
    <label class="block space-y-1.5"><span class="text-sm font-medium">Confirm new password</span>
      <input class="input w-full" type="password" name="confirm_password" autocomplete="new-password" minlength="{{ min_length }}" required></label>
  </div>
  <div class="flex flex-wrap items-center gap-3">
    <button class="btn btn-primary btn-sm" type="submit">Change password</button>
    {% if error %}<span class="text-sm text-error">{{ error }}</span>{% endif %}
    {% if saved %}<span class="flex items-center gap-1 text-sm text-success">{{ icon("circle-check", "size-4") }} Password changed. Other sessions were signed out and their notifications turned off.</span>{% endif %}
  </div>
</form>
