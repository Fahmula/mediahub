[project]
name = "mediahub"
version = "0.4.0"
description = "Self-hosted media monitoring dashboard for Emby, Sonarr, Radarr and InfiniDysk"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "python-multipart>=0.0.18",
    "websockets>=14",
    "http-ece>=1.2.1",
    "py-vapid>=1.9.6",
]

[project.scripts]
mediahub = "mediahub.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mediahub"]
# Built CSS is git-ignored but must ship in the wheel (the Docker image builds it first).
artifacts = ["src/mediahub/static/dist/*.css"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"src/mediahub/integrations/demo.py" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:mediahub.*",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.mypy]
python_version = "3.12"
packages = [
    "mediahub.models",
    "mediahub.integrations",
    "mediahub.monitoring",
    "mediahub.peers",
    "mediahub.push",
]
mypy_path = "src"
ignore_missing_imports = true
